plugins {
    id 'com.android.application'
}

android {
    namespace 'com.smarternow.bulkmessaging'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId "com.smarternow.bulkmessaging"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Minimal RAM: single dex, low memory footprint
        multiDexEnabled false
        vectorDrawables.useSupportLibrary = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                    "room.schemaLocation": "$projectDir/schemas",
                    "room.incremental": "true"
                ]
            }
        }
    }

    signingConfigs {
        release {
            // TODO: Replace with your production keystore before publishing to Google Play.
            // Set these four values via environment variables or a local keystore.properties
            // file (add keystore.properties to .gitignore — never commit secrets).
            //
            // Example keystore.properties:
            //   storeFile=../release.keystore
            //   storePassword=yourStorePassword
            //   keyAlias=yourKeyAlias
            //   keyPassword=yourKeyPassword
            //
            // Then load it here:
            //   def keystoreProps = new Properties()
            //   keystoreProps.load(new FileInputStream(rootProject.file("keystore.properties")))
            //   storeFile     file(keystoreProps["storeFile"])
            //   storePassword keystoreProps["storePassword"]
            //   keyAlias      keystoreProps["keyAlias"]
            //   keyPassword   keystoreProps["keyPassword"]
            //
            // Until a real keystore is configured, the release build falls back to the
            // debug signing config so the project still compiles locally.
            storeFile     file(System.getenv("RELEASE_STORE_FILE")     ?: (System.getProperty("user.home") + "/.android/debug.keystore"))
            storePassword (System.getenv("RELEASE_STORE_PASSWORD")     ?: "android")
            keyAlias      (System.getenv("RELEASE_KEY_ALIAS")          ?: "androiddebugkey")
            keyPassword   (System.getenv("RELEASE_KEY_PASSWORD")       ?: "android")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            // Keep debug light for low-RAM devices
            minifyEnabled false
            shrinkResources false
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

// After assembleRelease completes, copy the APK to the workspace root with the release filename.
tasks.whenTaskAdded { task ->
    if (task.name == 'assembleRelease') {
        task.doLast {
            def apk = file("${buildDir}/outputs/apk/release/app-release.apk")
            def dest = file("${rootProject.projectDir}/../Smarternow-Bulk-Messaging-v1.0-release.apk")
            if (apk.exists()) {
                copy {
                    from apk
                    into dest.parentFile
                    rename { dest.name }
                }
                println "APK copied to: ${dest.absolutePath}"
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Room Database
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'

    // RecyclerView
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // CardView
    implementation 'androidx.cardview:cardview:1.0.0'

    // OkHttp for Africa's Talking API - minimal pooled connections
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Splash Screen API
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // WorkManager for daily PWA sync (one per day)
    implementation 'androidx.work:work-runtime:2.9.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
